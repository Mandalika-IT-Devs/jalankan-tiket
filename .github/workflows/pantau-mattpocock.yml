# Watches mattpocock/skills releases (ADR-0002). When a release is not yet among the tested versions,
# opens one issue to test the kit's coupling points before Anthropic's official marketplace ships it to users.
name: Pantau mattpocock-skills

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pantau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open a compatibility issue for an untested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo mattpocock/skills --json tagName --jq .tagName)
          VERSION=${TAG#v}
          if jq -e --arg v "$VERSION" '.mattpocockSkills | index($v)' plugins/tiket/reference/tested-versions.json >/dev/null; then
            echo "mattpocock-skills $VERSION is already tested."
            exit 0
          fi
          TITLE="Uji kompatibilitas mattpocock-skills $VERSION"
          if [ -n "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number')" ]; then
            echo "An issue for $VERSION is already open."
            exit 0
          fi
          URL=$(gh release view "$TAG" --repo mattpocock/skills --json url --jq .url)
          cat > body.md <<EOF
          mattpocock-skills $VERSION was released: $URL

          The kit is tested with: $(jq -r '.mattpocockSkills | join(", ")' plugins/tiket/reference/tested-versions.json).

          ## Coupling points to check (ADR-0002)
          - [ ] \`grilling\`, \`domain-modeling\` and \`tdd\` still exist and are still model-invoked.
          - [ ] The glossary is still \`GLOSSARY.md\`, and the ADR folder is still \`docs/adr/\`.
          - [ ] The format of \`docs/agents/issue-tracker.md\`, \`triage-labels.md\` and \`domain.md\` is unchanged.
          - [ ] The five triage roles are unchanged.
          - [ ] Any new model-invoked skill that could take over a workflow step (such as \`pr\` in 1.3) is handled.

          ## When everything passes
          1. Install the release and run the validation project.
          2. Add the version to \`plugins/tiket/reference/tested-versions.json\` and to \`docs/*/versions.md\`.
          3. Release the kit if anything changed.
          EOF
          sed -i 's/^          //' body.md
          gh issue create --title "$TITLE" --body-file body.md
